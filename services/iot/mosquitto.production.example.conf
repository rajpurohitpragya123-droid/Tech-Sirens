listener 8883
allow_anonymous false
password_file /mosquitto/secrets/passwords
acl_file /mosquitto/secrets/acl
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
# Provision separate device credentials with ACLs restricting each exact field/device topic.
# Worker credentials may read telemetry and acknowledgements and publish commands.
